<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>グッズ｜一人プロジェクト</title>
<meta name="description" content="芋一人ロゴ入りキャップと干し芋。買うことが、活動を続ける力になります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/sub.css">
</head>
<body data-page="goods">
<main>
  <section class="page-hero">
    <div class="wrap">
      <div>
        <h1 class="d-xl" style="font-size:clamp(40px,6.6vw,84px)">買うことも、<br>応援になる。</h1>
        <p class="lead">手に取ってもらうことが、活動を続ける力になり、支援先への還元につながります。</p>
      </div>
      <div class="cap-stage no-imo" id="capStage" style="--cap:#6B6B2E">
        <svg id="capSvg" viewBox="0 0 240 170" role="img" aria-label="芋一人ロゴ入りキャップ"><use href="#cap"/></svg>
      </div>
    </div>
  </section>

  <section class="sec tint">
    <div class="wrap two-col">
      <div>
        <h2 class="d-l">芋一人ロゴ入りキャップ</h2>
        <p class="price">¥3,960</p>
        <p>シンプルなデザインと、軽やかなメッシュ素材のキャップ。</p>
      </div>
      <div>
        <p style="font-weight:900">色をえらぶ：<span id="colorName" style="color:var(--imo)">オリーブ</span></p>
        <div class="sw-row" role="group" aria-label="キャップの色">
          <button class="sw" style="--c:#8B8478" aria-pressed="false"><i></i>トープグレー</button>
          <button class="sw" style="--c:#8A8D8F" aria-pressed="false"><i></i>スモークグレー</button>
          <button class="sw" style="--c:#45474A" aria-pressed="false"><i></i>チャコールグレー</button>
          <button class="sw" style="--c:#7B5B3E" aria-pressed="false"><i></i>コヨーテブラウン</button>
          <button class="sw on" style="--c:#6B6B2E" aria-pressed="true"><i></i>オリーブ</button>
        </div>
        <p class="note" style="margin-top:10px">色は見本です。実物の写真に差し替えます。</p>
        <p style="margin-top:24px"><a class="btn" href="https://denalist.base.shop/" target="_blank" rel="noopener">オンラインショップで買う</a></p>
      </div>
    </div>
  </section>

  <section class="sec purple">
    <div class="wrap two-col">
      <div>
        <h2 class="d-l">畑から生まれた、干し芋</h2>
        <p style="margin-top:16px">畑で育てたさつまいもを、干し芋に。2025年3月には希望館にも届けました。</p>
        <p class="note" style="color:#F1D9EA;margin-top:14px">価格・販売場所は準備中です。</p>
      </div>
      <div class="hoshi-box">
        <button class="hoshi no-imo" id="hoshi" aria-label="干し芋をひと口かじる">
          <svg viewBox="0 0 220 120" aria-hidden="true">
            <defs><mask id="bites"><rect width="220" height="120" fill="#fff"/><g id="biteMarks"></g></mask></defs>
            <g mask="url(#bites)">
              <rect x="14" y="18" width="192" height="84" rx="22" fill="#E9A93A"/>
              <rect x="14" y="18" width="192" height="84" rx="22" fill="none" stroke="#C47F1C" stroke-width="4"/>
              <path d="M40 40c30 8 60-4 90 4s50 0 60 6M36 66c26 6 56-6 86 2s56 2 66 8M44 88c24 4 50-4 78 0" stroke="#FFD66B" stroke-width="5" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
        </button>
        <p class="hoshi-msg" id="hoshiMsg" aria-live="polite" style="color:var(--mitsu)">タップしてひと口どうぞ</p>
      </div>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cap" viewBox="0 0 240 170">
    <ellipse cx="120" cy="152" rx="96" ry="9" fill="rgba(0,0,0,.18)"/>
    <path d="M40 112C40 58 76 26 120 26s80 32 80 86z" fill="var(--cap)"/>
    <path d="M120 26c-14 22-18 52-16 86M120 26c14 22 18 52 16 86" stroke="rgba(0,0,0,.2)" stroke-width="2" fill="none"/>
    <path d="M62 58c18-10 38-14 58-14" stroke="rgba(255,255,255,.2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="120" cy="26" r="6" fill="var(--cap)" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
    <path d="M30 112h180c10 0 18 8 14 14-26 10-74 14-104 14s-78-4-104-14c-4-6 4-14 14-14z" fill="var(--cap)"/>
    <path d="M30 112h180c10 0 18 8 14 14-26 10-74 14-104 14s-78-4-104-14c-4-6 4-14 14-14z" fill="rgba(0,0,0,.2)"/>
    <text x="120" y="88" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="13" fill="#fff" opacity=".9">芋一人</text>
  </symbol>
</svg>
<script src="js/main.js"></script>
<script src="js/goods.js"></script>
</body>
</html>
