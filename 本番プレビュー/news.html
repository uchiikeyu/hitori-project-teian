<body data-page="news">
<main>
  <section class="sub-hero">
    <div class="wrap">
      <p class="en sub-en fade">News</p>
      <h1 class="h-hero rv"><span class="ln"><span>お知らせ</span></span></h1>
      <p class="lead fade" style="margin-top:28px">活動の報告と、これからのこと。日々の様子は Instagram でも発信しています。</p>
    </div>
  </section>

  <section class="sec" style="padding-top:40px">
    <div class="wrap">
      <!-- 一覧（WordPressの投稿が読めないときは、ここに書いたものが出る） -->
      <div id="newsIndex">
        <ul class="news-list" id="newsAll">
          <li><a class="news-row" href="https://www.instagram.com/hitori_project2026/" target="_blank" rel="noopener">
            <span class="num">2025.03.18</span><span class="news-cat">芋</span><span class="news-t">希望館に干し芋を納品しました</span><span class="arr" aria-hidden="true"></span></a></li>
        </ul>
        <div class="news-pager" id="newsPager" hidden>
          <button class="btn" id="newsMore"><span class="dot"></span>もっと見る</button>
        </div>
      </div>
      <!-- 1件の記事 -->
      <article class="post" id="post" hidden>
        <p class="post-meta"><span class="num" id="postDate"></span><span class="news-cat" id="postCat"></span></p>
        <h2 class="post-title" id="postTitle"></h2>
        <div class="post-img" id="postImg"></div>
        <div class="post-body" id="postBody"></div>
        <p class="post-back"><a class="btn" href="news.html"><span class="dot"></span>お知らせ一覧へ</a></p>
      </article>
    </div>
  </section>
